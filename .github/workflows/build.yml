name: Build DropDebugForge  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
    branches: [ main, master ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
  
      - name: Set up JDK 17  
        uses: actions/setup-java@v4  
        with:  
          java-version: '17'  
          distribution: 'temurin'  
  
      - name: Setup Gradle  
        uses: gradle/actions/setup-gradle@v4  
        with:  
          gradle-version: '8.5'  
  
      - name: Cache ForgeGradle files  
        uses: actions/cache@v4  
        with:  
          path: |  
            ~/.gradle/caches/forge_gradle/  
            ~/.gradle/caches/minecraft/  
          key: forgegradle-1.20.1-${{ hashFiles('build.gradle', 'gradle.properties') }}  
          restore-keys: |  
            forgegradle-1.20.1-  
  
      - name: Build with Gradle  
        run: gradle build  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: DropDebugForge  
          path: build/libs/DropDebugForge-*.jar  
          if-no-files-found: error